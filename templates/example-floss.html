<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;font-family:'Loma',sans-serif;}
  .card{position:relative;width:1080px;height:1080px;background:radial-gradient(circle at 30% 20%,#e9fbf9 0%,#c9efec 55%,#9fdcd8 100%);}
  .title{position:absolute;top:70px;left:0;right:0;text-align:center;color:#0e5e63;font-weight:bold;font-size:76px;line-height:1.25;}
  .title span{color:#f08a3c;}
  .sub{position:absolute;top:270px;left:0;right:0;text-align:center;color:#26777b;font-size:38px;}
  .tips{position:absolute;bottom:150px;left:70px;right:70px;display:flex;gap:22px;}
  .tip{flex:1;background:#ffffff;border-radius:28px;padding:24px 18px;text-align:center;color:#0e5e63;font-size:30px;font-weight:bold;box-shadow:0 8px 0 #7ccdc8;}
  .tip b{display:block;font-size:52px;margin-bottom:6px;}
  .foot{position:absolute;bottom:0;left:0;right:0;height:110px;background:#138a8f;color:#fff;display:flex;align-items:center;justify-content:center;gap:40px;font-size:34px;font-weight:bold;}
</style></head>
<body><div class="card">
  <div class="title">ไหมขัดฟัน<br><span>ทำไมต้องใช้ทุกวัน?</span></div>
  <div class="sub">ขนแปรงทำความสะอาดซอกฟันได้ไม่ทั่วถึง</div>

  <svg style="position:absolute;top:340px;left:0" width="1080" height="420" viewBox="0 0 1080 420">
    <!-- sparkles -->
    <g fill="#ffffff" opacity=".9">
      <path d="M160 90 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
      <path d="M900 70 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
      <path d="M930 300 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
      <path d="M130 300 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
    </g>
    <!-- floss line -->
    <path d="M200 40 C 420 120, 470 330, 540 330 C 610 330, 660 120, 880 40" fill="none" stroke="#f08a3c" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14"/>
    <!-- left tooth -->
    <g transform="translate(300,70)">
      <path d="M20 40 C 20 -10, 110 -10, 130 20 C 150 -10, 240 -10, 240 40 C 240 120, 215 160, 205 250 C 198 300, 160 300, 152 250 C 145 200, 115 200, 108 250 C 100 300, 62 300, 55 250 C 45 160, 20 120, 20 40 Z" fill="#ffffff" stroke="#0e5e63" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="95" cy="95" r="12" fill="#0e5e63"/><circle cx="165" cy="95" r="12" fill="#0e5e63"/>
      <circle cx="99" cy="91" r="4" fill="#fff"/><circle cx="169" cy="91" r="4" fill="#fff"/>
      <path d="M105 130 Q130 155 155 130" fill="none" stroke="#0e5e63" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="70" cy="125" rx="16" ry="9" fill="#ffb3a7"/><ellipse cx="190" cy="125" rx="16" ry="9" fill="#ffb3a7"/>
    </g>
    <!-- right tooth -->
    <g transform="translate(540,70)">
      <path d="M20 40 C 20 -10, 110 -10, 130 20 C 150 -10, 240 -10, 240 40 C 240 120, 215 160, 205 250 C 198 300, 160 300, 152 250 C 145 200, 115 200, 108 250 C 100 300, 62 300, 55 250 C 45 160, 20 120, 20 40 Z" fill="#ffffff" stroke="#0e5e63" stroke-width="8" stroke-linejoin="round"/>
      <path d="M80 98 Q95 84 110 98" fill="none" stroke="#0e5e63" stroke-width="7" stroke-linecap="round"/>
      <path d="M150 98 Q165 84 180 98" fill="none" stroke="#0e5e63" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 128 Q130 165 160 128 Z" fill="#0e5e63"/>
      <ellipse cx="70" cy="125" rx="16" ry="9" fill="#ffb3a7"/><ellipse cx="190" cy="125" rx="16" ry="9" fill="#ffb3a7"/>
    </g>
    <!-- floss between teeth -->
    <line x1="520" y1="0" x2="560" y2="330" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <line x1="520" y1="0" x2="560" y2="330" stroke="#5fc9c3" stroke-width="4" stroke-linecap="round"/>
    <!-- floss holder hands (simple) -->
    <circle cx="520" cy="0" r="16" fill="#f08a3c"/>
    <circle cx="560" cy="330" r="16" fill="#f08a3c"/>
  </svg>

  <div class="tips">
    <div class="tip"><b>1×</b>ใช้วันละครั้ง<br>ก่อนนอน</div>
    <div class="tip"><b>C</b>โอบไหมเป็นรูปตัว C<br>รอบซี่ฟัน</div>
    <div class="tip"><b>✓</b>ค่อย ๆ ขยับขึ้นลง<br>ไม่กระแทกเหงือก</div>
  </div>
  <div class="foot"><span>คลินิกทันตกรรมบางปะอิน</span><span>☎ 092-359-5963</span></div>
</div></body></html>
