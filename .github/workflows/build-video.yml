name: Build video

on:
  push:
    branches: [main]
    paths: ["videos/**/job.json"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder under videos/"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Find episodes to build
        id: eps
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            echo "list=videos/${{ github.event.inputs.episode }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(git diff --name-only HEAD~1 HEAD -- 'videos/**/job.json' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble
        run: for ep in ${{ steps.eps.outputs.list }}; do python3 tools/assemble.py "$ep"; done

      # Videos and voice clips go to a GitHub Release (one per episode), not into git history,
      # so they can be deleted later and really free space. Public URL:
      # https://github.com/<owner>/<repo>/releases/download/<episode>/<file>
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ep in ${{ steps.eps.outputs.list }}; do
            tag=$(basename "$ep")
            files=$(ls "$ep"/*.mp4; for f in "$ep"/voice/*.mp3; do cp "$f" "$ep/.work/${tag}-$(basename "$f")"; echo "$ep/.work/${tag}-$(basename "$f")"; done)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" $files --clobber
            else
              gh release create "$tag" $files --title "$tag" --notes "Auto-built video for $tag"
            fi
            echo "https://github.com/${{ github.repository }}/releases/download/$tag/$(basename "$ep"/*.mp4)"
          done
