name: Thai TTS samples

# สร้างเสียงตัวอย่างจากโมเดลเสียงไทยฟรี แล้วแนบไว้ที่ Release "tts-samples"
on:
  workflow_dispatch:
    inputs:
      only:
        description: "ว่าง = ทุกตัว หรือ edge / gtts / pythaitts / khanomtan / f5th"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: edge-tts
        if: inputs.only == '' || inputs.only == 'edge'
        continue-on-error: true
        run: pip install -q edge-tts && python tools/tts_samples/make.py edge out
      - name: gTTS
        if: inputs.only == '' || inputs.only == 'gtts'
        continue-on-error: true
        run: pip install -q gTTS && python tools/tts_samples/make.py gtts out
      - name: PyThaiTTS
        if: inputs.only == '' || inputs.only == 'pythaitts'
        continue-on-error: true
        run: pip install -q pythaitts && pip install -q "pythaitts[vachana]" "pythaitts[khanomtan]" "pythaitts[lunarlist_onnx]" "pythaitts[fastthaig2p]" 2>&1 | tail -3; python tools/tts_samples/make.py pythaitts out
      - name: F5-TTS-THAI
        if: inputs.only == '' || inputs.only == 'f5th'
        continue-on-error: true
        run: pip install -q f5-tts-th pythaitts "pythaitts[vachana]" && pip uninstall -y -q torchcodec; pip install -q --force-reinstall --no-deps torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip list 2>/dev/null | grep -iE "^torch|f5" ; python tools/tts_samples/make.py f5th out
      - name: KhanomTan (needs Coqui TTS)
        if: inputs.only == '' || inputs.only == 'khanomtan'
        continue-on-error: true
        run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q pythaitts coqui-tts && python tools/tts_samples/make.py pythaitts out khanomtan
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la out || exit 0
          gh release view tts-samples >/dev/null 2>&1 || gh release create tts-samples --title "Thai TTS samples" --notes "เสียงตัวอย่างจากโมเดลเสียงไทยฟรี"
          gh release upload tts-samples out/*.mp3 --clobber
