name: Free voice (Vachana)

# เสียงพากย์สำรองฟรีเมื่อเครดิต ElevenLabs หมด: สร้าง videos/<slug>/vo/NN.mp3 ด้วย VachanaTTS แล้ว commit กลับเข้า main
# เสียง: auto = สลับ th_f_1 (หญิง) / th_m_2 (ชาย) จากครั้งก่อน
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "slug ของตอน (โฟลเดอร์ใน videos/)"
        required: true
      voice:
        description: "auto / th_f_1 / th_m_2"
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: free-voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q pythaitts "pythaitts[vachana]"
      - run: python tools/free_voice.py "videos/${{ inputs.slug }}" "${{ inputs.voice }}"
      - name: Commit voice files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "videos/${{ inputs.slug }}" tools/free_voice_state.json
          git commit -m "Free voice (Vachana) for ${{ inputs.slug }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
